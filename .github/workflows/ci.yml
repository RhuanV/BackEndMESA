name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint + compile + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check backend
          ruff format --check backend
      - name: Byte-compile
        run: python -m compileall backend/src
      - name: Run tests
        run: pytest backend/tests -q

  migrations:
    name: Migrations (alembic upgrade head)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geoavia_main_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_EXT_PORT: "5432"
      DB_NAME: geoavia_main_db
      DB_USER: postgres
      DB_PASS: postgres
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply migrations to a fresh database
        working-directory: backend
        run: alembic upgrade head

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build

  frontend:
    name: Frontend (lint + test + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high || true
