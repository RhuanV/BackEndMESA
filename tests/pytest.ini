[pytest]
# Suppress third-party DeprecationWarnings emitted by the openlineage client that
# ships with the Airflow image (openlineage/client/run.py, filter.py). These come
# from a bundled library, not from our code, so they are filtered here rather than
# fixed at the source. The filter is scoped to the openlineage message so warnings
# from our own code stay visible.
filterwarnings =
    ignore:This module is deprecated. Please use `openlineage:DeprecationWarning

# The tests dir is a read-only host mount for the container user, so keep pytest's
# cache in a writable location to avoid a PytestCacheWarning.
cache_dir = /tmp/pytest_cache
